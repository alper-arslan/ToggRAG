name: CI
on:
    push:
        branches: [main]
    pull_request:
permissions:
  contents: read

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v10.2.0

            - name: Install dependencies
              run: uv sync --locked

            - name: Format check
              run: uv run ruff format --check .

            - name: ruff check
              run: uv run ruff check .
    test:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v10.2.0

            - name: Install dependencies
              run: uv sync --locked

            - name: Run tests
              run: uv run pytest