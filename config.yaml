pdf_path: data/manual.pdf #TODO: Change this with the actual file name.
data_dir: data

chunking:
  target_tokens: 400
  overlap_ratio: 0.12      # ~10-15% overlap between adjacent chunks

embedding:
  provider: ollama
  model: bge-m3
  base_url: http://localhost:11434

reranker:
  enabled: false           # needs the optional rerank extra
  provider: sentence-transformers
  model: BAAI/bge-reranker-v2-m3
  candidates: 20
  top_n: 5

retrieval:
  bm25_top_k: 20
  dense_top_k: 20
  rrf_k: 60                # standard RRF constant
  final_top_k: 5
  query_rewrite: false     # extra LLM call, off to save tokens

llm:
  provider: ollama
  model: qwen2.5:7b
  base_url: http://localhost:11434/v1
  temperature: 0.0
  max_tokens: 1024

vector_store:
  path: data/qdrant
  collection_name: togg_manual
  distance: cosine

